name: Publish coverage pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [coverage-updated]
  schedule:
    - cron: '22 4,16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download latest published LibreSign coverage snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download coverage-latest --repo "${GITHUB_REPOSITORY}" --dir downloads
          (cd downloads && sha256sum -c checksums.sha256)
          test -s downloads/metadata.json

      - name: Restore native octocov report and PHPUnit HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/LibreSign/libresign site/libresign site/badges
          gzip -dc downloads/libresign-octocov.json.gz > reports/LibreSign/libresign/report.json
          gzip -dc downloads/libresign-clover.xml.gz > site/libresign/clover.xml
          tar -xzf downloads/libresign-html.tar.gz -C site/libresign
          test -s reports/LibreSign/libresign/report.json
          test -s site/libresign/clover.xml
          test -s site/libresign/index.html

      - name: Generate repository index and badges with upstream octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.5

      - name: Add project navigation and historical archive
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.md
          mv site/index.md site/octocov-index.md
          sed -i 's#https://raw.githubusercontent.com/LibreSign/coverage/main/site/badges/#https://libresign.github.io/coverage/badges/#g' site/octocov-index.md
          {
            printf '%s\n' '---' 'title: LibreSign Coverage' '---'
            printf '%s\n' '# LibreSign code coverage' ''
            if jq -e '.preview == true' downloads/metadata.json >/dev/null; then
              printf '%s\n' '**Homologation preview:** real PHPUnit coverage from PR #9387, not a main-branch baseline.' ''
            fi
            printf '%s\n' '[View PHPUnit coverage by source line](./libresign/)'
            printf '%s\n' '[Download historical Coveralls data (2021-2026)](https://github.com/LibreSign/coverage/releases/tag/coveralls-archive-2026-11-07)' ''
            printf '%s\n' '## Current repositories' ''
            cat site/octocov-index.md
          } > site/index.md
          rm site/octocov-index.md

      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
