name: Publish coverage pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [coverage-updated]
  schedule:
    - cron: '22 4,16 * * *'

permissions:
  contents: read
  actions: read # public, cross-repo Octocov artifacts use this repository token
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check theme and publishing code
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          node --check site-theme/theme.js
          bash -n scripts/prepare_native_coverage.sh

      - name: Prefer the native Octocov report and PHPUnit artifacts from main
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/prepare_native_coverage.sh

      - name: Download legacy snapshot only while native reporting is unavailable
        if: steps.native.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download coverage-latest --repo "${GITHUB_REPOSITORY}" --dir downloads
          (cd downloads && sha256sum -c checksums.sha256)
          test -s downloads/metadata.json

      - name: Restore fallback report while the source PR awaits review
        if: steps.native.outputs.available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/LibreSign/libresign site/libresign site/badges
          gzip -dc downloads/libresign-octocov.json.gz > reports/LibreSign/libresign/report.json
          gzip -dc downloads/libresign-clover.xml.gz > site/libresign/clover.xml
          tar -xzf downloads/libresign-html.tar.gz -C site/libresign
          test -s reports/LibreSign/libresign/report.json
          test -s site/libresign/clover.xml
          test -s site/libresign/index.html

      - name: Generate repository index and badges with upstream octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          github-token: ${{ github.token }}
          version: v0.83.5
          config: ${{ steps.native.outputs.available == 'true' && '.octocov.yml' || '.octocov-fallback.yml' }}

      - name: Add project navigation and historical archive
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.md
          mv site/index.md site/octocov-index.md
          sed -i 's#https://raw.githubusercontent.com/LibreSign/coverage/main/site/badges/#https://libresign.github.io/coverage/badges/#g' site/octocov-index.md
          source_sha="$(jq -r '.source_commit_sha' downloads/metadata.json)"
          source_run_id="$(jq -r '.source_run_id' downloads/metadata.json)"
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ && "${source_run_id}" =~ ^[0-9]+$ ]] || {
            echo '::error::Coverage snapshot has invalid source identity'
            exit 1
          }
          {
            printf '%s\n' '---' 'title: LibreSign Coverage' '---'
            printf '%s\n' '# LibreSign code coverage' ''
            printf '%s\n' '[Coverage website source](https://github.com/LibreSign/coverage) · [LibreSign application source](https://github.com/LibreSign/libresign) · [Publishing workflow](https://github.com/LibreSign/coverage/blob/main/.github/workflows/pages.yml)' ''
            if jq -e '.preview == true' downloads/metadata.json >/dev/null; then
              printf '%s\n' '**Homologation preview:** real PHPUnit coverage from PR #9387, not the main-branch baseline. Native artifacts will replace this automatically after the source PR is merged.' ''
            else
              printf '%s\n' 'Source: upstream Octocov native GitHub Actions artifacts from the LibreSign main branch.' ''
            fi
            printf 'Source: [GitHub Actions run %s](https://github.com/LibreSign/libresign/actions/runs/%s), commit %s.\n\n' "${source_run_id}" "${source_run_id}" "${source_sha}"
            printf '%s\n' '[View PHPUnit coverage by source line](./libresign/)'
            printf '%s\n' '[Download historical Coveralls data (2021-2026)](https://github.com/LibreSign/coverage/releases/tag/coveralls-archive-2026-11-07)' ''
            printf '%s\n' 'Metric note: Octocov measures instrumented statements in Clover; legacy Coveralls percentages use a different denominator and must not be compared directly.' ''
            printf '%s\n' '## Current repositories' ''
            cat site/octocov-index.md
          } > site/index.md
          rm site/octocov-index.md

      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site

      - name: Preserve PHPUnit static assets excluded by Jekyll
        shell: bash
        run: |
          set -euo pipefail
          # Jekyll skips underscore-prefixed asset directories and its Docker
          # action creates a build tree that the runner cannot write into.
          # Stage a writable copy, preserving the rendered root index.
          mkdir -p public
          cp -R --no-preserve=mode _site/. public/
          for asset_dir in _css _js _icons; do
            if [[ ! -d "site/libresign/$asset_dir" ]]; then
              echo "::error::Missing PHPUnit asset directory: $asset_dir"
              exit 1
            fi
            cp -R "site/libresign/$asset_dir" public/libresign/
          done
          for asset in _css/bootstrap.min.css _css/style.css _js/jquery.min.js _icons/file-directory.svg; do
            if [[ ! -s "public/libresign/$asset" ]]; then
              echo "::error::Missing PHPUnit asset: $asset"
              exit 1
            fi
          done
          test -s public/index.html
          test -s public/libresign/index.html
          test -s public/libresign/dashboard.html

      - name: Add theme and source-code navigation to published HTML
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_site.py --public public --metadata downloads/metadata.json
          test -s public/assets/coverage-theme/theme.css
          test -s public/assets/coverage-theme/theme.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
