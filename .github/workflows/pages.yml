name: Publish coverage pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [coverage-updated]
  schedule:
    - cron: '22 4,16 * * *'

permissions:
  contents: write # only within LibreSign/coverage, for verified release archives
  actions: read # source Octocov reports and PHPUnit artifacts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, zlib, phar
          coverage: none

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate publisher and browser code
        shell: bash
        run: |
          set -euo pipefail
          composer test
          for source in src/*.php scripts/*.php tests/*.php templates/*.php; do php -l "$source"; done
          node --check site-theme/theme.js
          node --check site-theme/trend.js
          node --check site-theme/overview.js

      - name: Archive the exact successful main run triggering this update
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          COVERAGE_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          COVERAGE_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          ARCHIVE_CURRENT_FALLBACK: 'false'
        shell: bash
        run: |
          set -euo pipefail
          php scripts/coverage.php native
          grep -qx 'available=true' "${GITHUB_OUTPUT}"
          php scripts/coverage.php archive
          # Do not publish older dispatched coverage as the latest measurement.
          rm -rf downloads site/libresign site/badges

      - name: Select verified native Octocov and PHPUnit main artifacts
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/coverage.php native

      - name: Archive verified main measurements in the publishing repository
        if: steps.native.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/coverage.php archive

      - name: Download legacy snapshot while main artifacts are unavailable
        if: steps.native.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          gh release download coverage-latest --repo "${GITHUB_REPOSITORY}" --dir downloads
          php scripts/coverage.php restore-fallback

      - name: Generate index and badges with upstream Octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          github-token: ${{ github.token }}
          version: v0.83.5
          config: ${{ steps.native.outputs.available == 'true' && '.octocov.yml' || '.octocov-fallback.yml' }}

      - name: Add homepage navigation
        run: php scripts/coverage.php site-index

      - name: Summarize verified coverage without rerunning PHP tests
        run: php scripts/coverage.php summary

      - name: Build coverage history from verified archived measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: php scripts/coverage.php history

      - name: Configure the canonical GitHub Pages domain
        run: php scripts/coverage.php jekyll-config

      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site

      - name: Preserve PHPUnit static assets and verify generated site
        run: php scripts/coverage.php stage-public

      - name: Add theme and source-code navigation to published HTML
        shell: bash
        run: |
          set -euo pipefail
          php scripts/coverage.php theme --public public --metadata downloads/metadata.json
          php scripts/coverage.php trend-page --public public
          php scripts/coverage.php dashboard --public public
          test -s public/assets/coverage-theme/theme.js
          test -s public/assets/coverage-theme/trend.js
          test -s public/assets/coverage-theme/overview.js
          test -s public/assets/coverage-summary.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
