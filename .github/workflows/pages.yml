name: Publish coverage pages

on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: 'Optional LibreSign pull request run ID to preview before merge'
        required: false
        type: string
  push:
    branches:
      - main
  schedule:
    - cron: '22 4,16 * * *'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create scoped GitHub App token for the source repository
        id: source-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LIBRECODE_WORKFLOW_APP_CLIENT_ID }}
          private-key: ${{ secrets.LIBRECODE_WORKFLOW_APP_PRIVATE_KEY }}
          owner: LibreSign
          repositories: |
            coverage
            libresign
          permission-actions: read
          permission-contents: read

      - name: Prepare output
        run: mkdir -p site/libresign site/badges

      - name: Select source PHPUnit run
        id: source
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PREVIEW_RUN_ID}" ]]; then
            [[ "${PREVIEW_RUN_ID}" =~ ^[0-9]+$ ]] || { echo '::error::Invalid preview run ID'; exit 1; }
            echo "run_id=${PREVIEW_RUN_ID}" >> "${GITHUB_OUTPUT}"
            echo 'preview=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for run_id in $(gh api 'repos/LibreSign/libresign/actions/workflows/phpunit-sqlite.yml/runs?branch=main&status=success&per_page=30' --jq '.workflow_runs[].id'); do
            count="$(gh api "repos/LibreSign/libresign/actions/runs/${run_id}/artifacts" --jq '[.artifacts[] | select((.expired == false) and (.name | startswith("phpunit-coverage-")))] | length')"
            if [[ "${count}" -gt 0 ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo 'preview=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          # Homologation only. This real PHPUnit run is from PR #9387.
          echo 'run_id=42426595978' >> "${GITHUB_OUTPUT}"
          echo 'preview=true' >> "${GITHUB_OUTPUT}"

      - name: Load real Octocov preview until source main is available
        if: steps.source.outputs.preview == 'true'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/LibreSign/libresign
          gh release download octocov-preview-2026-11-07 --repo LibreSign/coverage --pattern 'octocov-preview-2026-11-07.json.gz' --dir .
          gzip -dc octocov-preview-2026-11-07.json.gz > reports/LibreSign/libresign/report.json
          test -s reports/LibreSign/libresign/report.json

      - name: Confirm native Octocov report is present for main
        if: steps.source.outputs.preview == 'false'
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/LibreSign/libresign/actions/runs/${{ steps.source.outputs.run_id }}/artifacts" --jq '[.artifacts[] | select((.expired == false) and (.name == "octocov-report"))] | length')"
          [[ "${count}" -gt 0 ]] || { echo '::error::Selected main run lacks a native Octocov report'; exit 1; }

      - name: Generate repository index and badges with octocov central mode
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          github-token: ${{ steps.source-token.outputs.token }}
          version: v0.83.5
          config: ${{ steps.source.outputs.preview == 'true' && '.octocov-preview.yml' || '.octocov.yml' }}

      - name: Download PHPUnit Clover and HTML artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          repository: LibreSign/libresign
          run-id: ${{ steps.source.outputs.run_id }}
          pattern: phpunit-coverage-*
          path: downloaded
          github-token: ${{ steps.source-token.outputs.token }}

      - name: Select and publish the reference PHPUnit HTML report
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' reports < <(find downloaded -type f -path '*/html-coverage/index.html' -print0)
          [[ "${#reports[@]}" -gt 0 ]] || { echo '::error::No HTML report in artifact'; exit 1; }
          selected=''
          # Prefer the Nextcloud master matrix; sort by PHP version for deterministic selection.
          while IFS= read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            selected="${candidate}"
            [[ "${candidate}" == *-nextcloud-master/* ]] && break
          done < <(printf '%s\n' "${reports[@]}" | sort -Vr)
          [[ -n "${selected}" ]] || exit 1
          report_dir="$(dirname "${selected}")"
          artifact_dir="$(dirname "${report_dir}")"
          [[ -s "${artifact_dir}/clover.xml" ]] || { echo '::error::Clover missing'; exit 1; }
          cp -a "${report_dir}/." site/libresign/
          cp "${artifact_dir}/clover.xml" site/libresign/clover.xml
          test -s site/libresign/index.html
          printf 'Published %s from run %s\n' "${artifact_dir}" "${{ steps.source.outputs.run_id }}"

      - name: Add a project home and legacy archive link
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.md
          mv site/index.md site/octocov-index.md
          # Badge files exist in Pages artifacts, never as unsigned commits.
          sed -i 's#https://raw.githubusercontent.com/LibreSign/coverage/main/site/badges/#https://libresign.github.io/coverage/badges/#g' site/octocov-index.md
          {
            printf '%s\n' '---' 'title: LibreSign Coverage' '---'
            printf '%s\n' '# LibreSign code coverage' ''
            if [[ "${{ steps.source.outputs.preview }}" == 'true' ]]; then
              printf '%s\n' '**Homologation preview:** real PHPUnit coverage from LibreSign/libresign PR #9387, not the main-branch baseline.' ''
            fi
            printf '%s\n' '[View PHPUnit coverage by source line](./libresign/)'
            printf '%s\n' '[Download historical Coveralls data (2021-2026)](https://github.com/LibreSign/coverage/releases/tag/coveralls-archive-2026-11-07)' ''
            printf '%s\n' '## Current repositories' ''
            cat site/octocov-index.md
          } > site/index.md
          rm site/octocov-index.md

      - name: Build GitHub Pages with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
