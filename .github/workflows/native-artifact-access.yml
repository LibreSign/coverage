name: Verify native Octocov artifact access

on:
  pull_request:
    paths:
      - '.github/workflows/native-artifact-access.yml'
      - '.octocov-artifact-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-artifact-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public artifact download with this repository token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api 'repos/k1LoW/octocov/actions/artifacts?per_page=100' --jq '.artifacts | map(select(.name=="octocov-report" and .expired==false)) | first | .id')"
          [[ "${artifact_id}" =~ ^[0-9]+$ ]]
          code="$(curl --silent --location --output /tmp/octocov-public-report.zip --write-out '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/k1LoW/octocov/actions/artifacts/${artifact_id}/zip")"
          echo "Public cross-repo artifact download HTTP status: ${code}"
          [[ "${code}" == "200" ]] || exit 1
          unzip -t /tmp/octocov-public-report.zip | tail -n 2
      - name: Prepare local badge directory
        run: mkdir -p test-output/badges

      - name: Run upstream Octocov central mode directly on public artifacts
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          github-token: ${{ github.token }}
          config: .octocov-artifact-smoke.yml
          version: v0.83.5
      - name: Assert central report and badges
        shell: bash
        run: |
          set -euo pipefail
          test -s test-output/octocov-index.md
          test -s test-output/badges/k1LoW/octocov/coverage.svg
          grep -q 'k1LoW/octocov' test-output/octocov-index.md
