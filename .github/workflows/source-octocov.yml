# Reusable coverage collector executed in the LibreSign workflow context.
# Artifacts and the native Octocov report remain attached to LibreSign's run;
# durable archiving and the Pages website remain owned by this repository.
name: Collect LibreSign Octocov metrics

on:
  workflow_call:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LibreSign
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download PHPUnit Clover reports from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phpunit-coverage-*
          path: coverage-artifacts

      - name: Select the reference PHPUnit environment
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find coverage-artifacts -type f -name clover.xml | sort -Vr)
          [[ ${#reports[@]} -gt 0 ]] || {
            echo '::error::No PHPUnit Clover artifact was published'
            exit 1
          }
          selected=''
          for candidate in "${reports[@]}"; do
            if [[ "${candidate}" == *-nextcloud-master/* ]]; then
              selected="${candidate}"
              break
            fi
          done
          mkdir -p .octocov-coverage
          cp "${selected:-${reports[0]}}" .octocov-coverage/clover.xml

      - name: Publish Octocov report and PR comparison
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.5
