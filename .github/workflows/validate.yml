name: Validate coverage publisher

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, mbstring, xml, zlib, phar
          coverage: none

      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHP unit and integration tests
        run: composer test

      - name: Check PHP syntax and browser assets
        shell: bash
        run: |
          set -euo pipefail
          for source in src/*.php scripts/*.php tests/*.php templates/*.php; do
            php -l "$source"
          done
          node --check site-theme/theme.js
          node --check site-theme/trend.js
          node --check site-theme/overview.js
